<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paytm Payment Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-mesh" aria-hidden="true"></div>

  <main class="page">
    <header class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="36" height="36">
          <rect width="40" height="40" rx="10" fill="#00BAF2"/>
          <text x="20" y="26" text-anchor="middle" fill="#fff" font-family="Outfit, sans-serif" font-size="16" font-weight="700">P</text>
        </svg>
      </div>
      <h1>Paytm</h1>
    </header>

    <p class="subtitle">Add your QR, amount, and mobile — then push</p>

    <section class="form-block" aria-labelledby="form-heading">
      <h2 id="form-heading">Payment details</h2>

      <form id="paymentForm" novalidate>
        <div class="field" id="qrField">
          <span>Add QR code</span>
          <label class="qr-upload" for="qrFile">
            <input
              type="file"
              id="qrFile"
              name="qrFile"
              accept="image/*"
              required
            />
            <div class="qr-empty" id="qrEmpty">
              <span class="qr-plus">+</span>
              <span>Upload QR image</span>
              <small>PNG, JPG, or WEBP</small>
            </div>
            <div class="qr-preview" id="qrPreview" hidden>
              <img id="qrImage" alt="Uploaded Paytm QR" />
              <button type="button" class="qr-change" id="qrChange">Change QR</button>
            </div>
          </label>
          <small class="error" id="qrError" hidden>Please add a QR image</small>
        </div>

        <label class="field">
          <span>Amount (₹)</span>
          <input
            type="number"
            id="amount"
            name="amount"
            min="1"
            step="1"
            placeholder="100"
            required
          />
          <small class="error" id="amountError" hidden>Enter an amount of at least ₹1</small>
        </label>

        <label class="field">
          <span>Mobile number</span>
          <div class="input-row">
            <span class="prefix">+91</span>
            <input
              type="tel"
              id="mobile"
              name="mobile"
              inputmode="numeric"
              maxlength="10"
              placeholder="9876543210"
              autocomplete="tel-national"
              required
            />
          </div>
          <small class="error" id="mobileError" hidden>Enter a valid 10-digit mobile number</small>
        </label>

        <button type="submit" class="push-btn" id="pushBtn">
          <span class="btn-label">Push payment details</span>
          <span class="btn-spinner" hidden aria-hidden="true"></span>
        </button>
      </form>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
